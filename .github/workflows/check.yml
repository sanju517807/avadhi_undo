name: Avadhi Undo Live Check

on:
  schedule:
    # Every 10 minutes from 05:30 to 08:30 IST.
    - cron: '*/10 0-3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: avadhi-undo-live-check
  cancel-in-progress: true

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: python -m pip install --upgrade requests beautifulsoup4

      - name: Verify Project Files
        run: |
          test -f scraper.py
          test -f status.json
          test -f config.json
          python -m py_compile scraper.py

      - name: Execute Scraper
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python scraper.py

      - name: Commit & Push Updated Data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status.json
          if git diff --cached --quiet; then
            echo "No status changes to commit."
            exit 0
          fi
          git commit -m "Auto-update civic status [skip ci]"
          git push
