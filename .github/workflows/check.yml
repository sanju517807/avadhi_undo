name: Avadhi Undo Live Check

on:
  schedule:
    # Every 10 minutes from 05:30 to 08:30 IST.
    - cron: '*/10 0-3 * * *'
  workflow_dispatch:
    inputs:
      telegram_test:
        description: 'Send a one-time Telegram integration test to @avadhiundo'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: avadhi-undo-live-check
  cancel-in-progress: true

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: python -m pip install --upgrade requests beautifulsoup4

      - name: Verify Project Files
        run: |
          test -f scraper.py
          test -f status.json
          test -f config.json
          python -m py_compile scraper.py

      - name: Execute Scraper
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python scraper.py

      - name: Test Telegram Integration
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.telegram_test == true }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "ERROR: TELEGRAM_BOT_TOKEN secret is missing."
            exit 1
          fi
          response=$(curl --fail --silent --show-error \
            --request POST \
            --data-urlencode "chat_id=@avadhiundo" \
            --data-urlencode "text=🧪 AVADHI UNDO — Telegram integration test\n\nGitHub Actions successfully reached the Telegram Bot API.\nTime: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage")
          echo "$response" | python -c 'import json,sys; data=json.load(sys.stdin); assert data.get("ok") is True, data; print("Telegram API accepted the test message.")'

      - name: Commit & Push Updated Data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status.json
          if git diff --cached --quiet; then
            echo "No status changes to commit."
            exit 0
          fi
          git commit -m "Auto-update civic status [skip ci]"
          git push
