name: Avadhi Undo Alert Check

on:
  schedule:
    # Runs every 10 minutes between 00:00 UTC (5:30 AM IST) and 03:00 UTC (8:30 AM IST)
    - cron: '*/10 0-3 * * *'
  workflow_dispatch:

jobs:
  scrape-and-alert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests beautifulsoup4

      - name: Verify scraper exists
        run: |
          echo "Repository files:"
          find . -maxdepth 3 -type f | sort
          test -f scraper.py || { echo "ERROR: scraper.py not found at repository root"; exit 1; }

      - name: Run Scraper
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python scraper.py

      - name: Commit and Push Updated Status
        run: |
          git config --global user.name "AvadhiUndoBot"
          git config --global user.email "bot@avadhiundo.com"
          git add status.json
          git commit -m "Auto-update holiday status [skip ci]" || exit 0
          git push
